<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chequeo de equipos Constructor Center</title>
<meta name="theme-color" content="#0D2B4E">
<style>
:root{--dark:#0D2B4E;--dark2:#16426F;--amber:#F5A623;--ok:#2E7D32;--okbg:#E3F4E4;--warn:#E65100;--warnbg:#FFF0E0;--bad:#C62828;--badbg:#FDE3E3;--doc:#6A1B9A;--bg:#F2F5F9;--card:#fff;--txt:#1F2D3A;--mut:#64748B;--line:#E2E8F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
header .t{font-weight:800;font-size:17px;letter-spacing:.2px}.hrow{display:flex;align-items:center;gap:12px}.logo{height:44px;background:#fff;border-radius:10px;padding:3px 6px}
.vozb{border:0;background:#ffffff22;color:#fff;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer;flex:0 0 44px}.vozb.off{opacity:.5}
.oir{border:0;background:#EEF4FB;color:var(--dark2);font-weight:800;font-size:13px;border-radius:9px;padding:5px 9px;cursor:pointer;margin-left:6px}
.hablando{outline:3px solid var(--amber);outline-offset:2px}header .s{color:var(--amber);font-size:12.5px;font-weight:600;margin-top:2px}
.prog{height:6px;background:#ffffff30;border-radius:9px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001,0 4px 14px #0d2b4e0d}
h2{margin:4px 0 6px;font-size:20px;color:var(--dark)}h3{margin:0 0 8px;font-size:16px;color:var(--dark)}
p.m{color:var(--mut);margin:0 0 12px;font-size:14.5px;line-height:1.4}
label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dark2)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--dark);color:#fff;cursor:pointer}
.btn.am{background:var(--amber);color:#1b1b1b}.btn.gh{background:#fff;color:var(--dark);border:2px solid var(--line)}.btn:disabled{opacity:.45}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}.foot .btn{padding:14px}.foot .gh{flex:0 0 34%}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;margin:3px 4px 3px 0}
.b-ok{background:var(--okbg);color:var(--ok)}.b-w{background:var(--warnbg);color:var(--warn)}.b-x{background:var(--badbg);color:var(--bad)}.b-n{background:#EEF2F7;color:var(--mut)}
.eqs{display:grid;gap:12px}
.eq{display:flex;align-items:center;gap:14px;border:2.5px solid var(--line);border-radius:16px;padding:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.eq svg{flex:0 0 92px;height:58px}.eq b{font-size:17px;display:block}.eq span{font-size:13px;color:var(--mut)}
.eq.sel{border-color:var(--amber);background:#FFF8EA}.eq .sug{font-size:11.5px;font-weight:800;color:var(--ok);display:block;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{background:#EEF4FB;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.45}
.info.w{background:var(--warnbg)}.info.x{background:var(--badbg)}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.bh .ic{font-size:34px;width:52px;height:52px;border-radius:14px;background:#FFF3DC;display:grid;place-items:center}
.item{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff;transition:border-color .2s}
.item.v-B{border-color:#A5D6A7}.item.v-R{border-color:#FFCC80}.item.v-M{border-color:#EF9A9A}.item.v-NA{border-color:#CFD8DC}
.it-h{display:flex;gap:10px;align-items:flex-start}.it-h .e{font-size:24px;line-height:1}.it-h b{font-size:15.5px}
.crit{font-size:11px;font-weight:800;color:var(--bad);background:var(--badbg);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tip{font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.why{border:0;background:none;color:var(--dark2);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer}
.whyt{display:none;font-size:13.5px;background:#FFF8EA;border-radius:10px;padding:8px 10px;margin-top:4px;line-height:1.4}.whyt.on{display:block}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px 2px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--mut)}
.opts button .x{display:block;font-size:20px;margin-bottom:2px}
.opts .on.B{background:var(--ok);border-color:var(--ok);color:#fff}.opts .on.R{background:var(--warn);border-color:var(--warn);color:#fff}
.opts .on.M{background:var(--bad);border-color:var(--bad);color:#fff}.opts .on.NA{background:#78909C;border-color:#78909C;color:#fff}
.det{margin-top:10px;display:none}.det.on{display:block}.det textarea{min-height:58px;font-size:15px}
.ph{display:flex;align-items:center;gap:10px;margin-top:8px}.ph label{font-size:14px;font-weight:700;color:var(--dark2);cursor:pointer;border:2px dashed #B0BEC5;border-radius:10px;padding:8px 12px}
.ph img{height:54px;border-radius:8px}
.sem{border-radius:18px;padding:18px;text-align:center;color:#fff;margin-bottom:14px}
.sem .r{font-size:30px;font-weight:900;letter-spacing:.5px}.sem .m{font-size:15px;margin-top:4px;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 3px #0001}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut);font-weight:700}
.al{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.al:last-child{border:0}
.al i{font-style:normal;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;white-space:nowrap}
.lv-Crítica{background:var(--badbg);color:var(--bad)}.lv-Documento{background:#F3E5F5;color:var(--doc)}.lv-Media{background:var(--warnbg);color:var(--warn)}.lv-Leve{background:#EEF2F7;color:var(--mut)}
.who{display:flex;align-items:center;gap:12px;padding:11px;border:2px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer;background:#fff}
.who.on{border-color:var(--dark2);background:#EEF4FB}.who .ck{width:26px;height:26px;border-radius:8px;border:2px solid #B0BEC5;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 26px}
.who.on .ck{background:var(--dark2);border-color:var(--dark2)}.who b{font-size:15px}.who span{display:block;font-size:12.5px;color:var(--mut)}.who.lock{cursor:default}
canvas{width:100%;height:150px;border:2px dashed #B0BEC5;border-radius:12px;background:#fff;touch-action:none}
.center{text-align:center}.big{font-size:56px}.mut{color:var(--mut)}.small{font-size:13px}
.hide{display:none!important}.spin{width:42px;height:42px;border:5px solid #E2E8F0;border-top-color:var(--amber);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}
.chip{display:inline-block;background:#EEF2F7;border-radius:99px;padding:6px 12px;margin:4px 4px 0 0;font-size:13.5px;font-weight:700;cursor:pointer;border:2px solid transparent}.chip.on{border-color:var(--amber);background:#FFF8EA}
.pie{text-align:center;color:#94A3B8;font-size:11.5px;margin-top:20px}
</style>
</head>
<body>

<main id="app"></main>
<div class="foot hide" id="foot"><div class="in"><button class="btn gh" id="bBack">← Atrás</button><button class="btn am" id="bNext">Siguiente →</button></div></div>

// ===================== VOZ (como en las plataformas de capacitación) =====================
const VOZ = (() => {
  const ss = window.speechSynthesis; let voz = null, muted = false, tok = 0;
  try { muted = localStorage.getItem('cc_chequeo_mute') === '1'; } catch (e) {}
  const RARA = /eloquence|bad news|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|ralph|grandma|grandpa|rocko|sandy|shelley|flo|reed/i;
  const cal = v => (/natural|neural|online|premium|enhanced|mejorad/i.test(v.name) ? 40 : 0) + (/google/i.test(v.name) ? 15 : 0) + (/CL$/i.test(v.lang.replace('_', '-')) || /chile/i.test(v.name) ? 30 : /419|MX|US|AR|CO|PE/i.test(v.lang) ? 12 : 0);
  const elegir = () => { if (!ss) return; const vs = ss.getVoices().filter(v => /^es/i.test(v.lang) && !RARA.test(v.name)); if (vs.length) voz = vs.sort((a, b) => cal(b) - cal(a))[0]; };
  if (ss) { elegir(); ss.onvoiceschanged = elegir;
    const unlock = () => { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; ss.speak(u); } catch (e) {} document.removeEventListener('pointerdown', unlock, true); };
    document.addEventListener('pointerdown', unlock, true); }
  const DIC = [[/\bSOAP\b/g, 'soap'], [/\bA4\b/g, 'A 4'], [/\bA5\b/g, 'A 5'], [/\bRUT\b/g, 'rut'], [/\bkm\b/g, 'kilómetros'], [/\bN°/g, 'número'], [/1\/4/g, 'un cuarto'], [/[«»"“”]/g, ''], [/\s·\s/g, ', ']];
  const limpiar = t => DIC.reduce((x, [a, b]) => x.replace(a, b), String(t).replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
  function say(texto, el) {
    const my = ++tok; document.querySelectorAll('.hablando').forEach(e => e.classList.remove('hablando'));
    if (!ss || muted || !texto) return;
    const u = new SpeechSynthesisUtterance(limpiar(texto)); if (voz) { u.voice = voz; u.lang = voz.lang; } else u.lang = 'es-ES'; u.rate = 1.02;
    if (el) { el.classList.add('hablando'); u.onend = u.onerror = () => el.classList.remove('hablando'); }
    try { ss.cancel(); setTimeout(() => { if (my === tok) { ss.resume(); ss.speak(u); } }, 120); } catch (e) {}
  }
  function stop() { tok++; try { ss && ss.cancel(); } catch (e) {} document.querySelectorAll('.hablando').forEach(e => e.classList.remove('hablando')); }
  function setMute(m) { muted = m; try { localStorage.setItem('cc_chequeo_mute', m ? '1' : '0'); } catch (e) {} if (m) stop(); }
  return { say, stop, setMute, get muted() { return muted; } };
})();
function togVoz() { VOZ.setMute(!VOZ.muted); pintaVoz(); if (!VOZ.muted) VOZ.say('Voz activada. Te iré guiando en el chequeo.'); }
function pintaVoz() { const b = document.getElementById('bVoz'); if (b) { b.textContent = VOZ.muted ? '🔇' : '🔊'; b.classList.toggle('off', VOZ.muted); } }
function oirItem(k) { const [bid, iid] = k.split('.'), b = bloques().find(x => x.id === bid), it = b && b.items.find(x => x.id === iid); if (!it) return;
  VOZ.say(it.t + '. ' + it.tip + ' ¿Por qué importa? ' + it.why + (it.crit ? ' Este punto es crítico: si está malo, el equipo no opera.' : ''), document.getElementById('it-' + k.replace('.', '-'))); }
// Lo que dice la voz al entrar a cada pantalla
function vozPantalla() {
  const p = S.paso;
  if (p === 0) return VOZ.say('Hola. Vamos a hacer el chequeo semanal de tu equipo. Escribe tu rut y toca comenzar.');
  if (p === 1) return VOZ.say('Hola ' + S.persona.nombre.split(' ')[0] + '. ¿Qué equipo vas a revisar hoy? Elige camión, tracto camión o grúa horquilla.' + (S.tipo ? ' ' + licEstado(S.tipo).t.replace(/^\S+\s/, '') + '.' : ''));
  if (p === 2) return VOZ.say('Ahora los datos del equipo. Elige la patente, anota el ' + (TIPOS[S.tipo].km ? 'kilometraje' : 'horómetro') + (TIPOS[S.tipo].km ? ' y revisa las fechas del seguro, el permiso de circulación y la revisión técnica.' : '.'));
  if (p < pasoResumen()) { const b = bloques()[p - 3]; return VOZ.say('Parte ' + (p - 2) + ' de ' + nB() + ': ' + b.t + '. ' + (b.d || '') + ' Marca cada punto. Si tienes dudas, toca escuchar.'); }
  if (p === pasoResumen()) { const E = evaluar(); return VOZ.say('Resultado: ' + E.resultado + '. ' + E.mensaje + (E.al.length ? ' Se encontraron ' + E.al.length + ' alertas.' : ' Sin alertas.') + (() => { const I = indicadores(); return (I.faltanTxt ? ' Cambio de aceite: ' + I.faltanTxt + '.' : '') + (I.rend ? ' Rendimiento: ' + String(I.rend).replace('.', ',') + ' ' + I.unidad.replace('km/L', 'kilómetros por litro').replace('L/h', 'litros por hora') + '.' : ''); })()); }
  if (p === pasoReporte()) return VOZ.say('Último paso. Marca a quién le reportas este chequeo, firma con el dedo y toca enviar informe.');
}

// ===================== ESTADO =====================
const S = { paso: 0, rut: '', persona: null, capac: {}, enc: [], equipos: [], tipo: '', energia: '', patente: '', marca: '', rampla: '', km: '', prox: '', soap: '', permiso: '', rt: '', litros: '',
  sucursal: '', licOk: null, eqInfo: null, res: {}, com: {}, fotos: {}, obs: '', rep: [], firma: '', enviando: false, fin: null };
const LS = 'cc_chequeo_borrador';
const guarda = () => { try { const c = Object.assign({}, S); delete c.fin; delete c.enviando; localStorage.setItem(LS, JSON.stringify(c)); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rutKey = s => String(s || '').replace(/[^0-9kK]/g, '').toUpperCase().replace(/^0+/, '');
const rutFmt = s => { const r = rutKey(s); return r.length < 2 ? s : r.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + r.slice(-1); };
const patKey = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const aFecha = s => { let m = String(s || '').match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if (m) return new Date(+m[3], +m[2] - 1, +m[1]); m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const dd = d => d ? String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear() : '';
const iso = s => { const d = aFecha(s); return d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : ''; };
const dias = s => { const d = aFecha(s); if (!d) return null; const h = new Date(); h.setHours(0, 0, 0, 0); return Math.round((d - h) / 864e5); };
const num = s => Number(String(s || '').replace(/[^\d]/g, '')) || 0;
const corto = n => { const w = String(n || '').trim().split(/\s+/); return w.length > 2 ? w[0] + ' ' + w[w.length - 2] : w.join(' '); };

function bloques() {
  if (!S.tipo) return [];
  if (S.tipo === 'grua') { const b = B_GRUA.slice(); b[1] = B_ENERGIA[S.energia] || null; return b.filter(Boolean); }
  const b = B_CAMION.slice(); b[3] = S.tipo === 'tracto' ? B_ENGANCHE_A5 : B_CARGA_A4; return b;
}
// pasos: 0 rut · 1 operador+equipo · 2 datos equipo · 3..n bloques · n+1 resumen · n+2 reportar · n+3 fin
const nB = () => bloques().length;
const pasoResumen = () => 3 + nB(), pasoReporte = () => 4 + nB(), pasoFin = () => 5 + nB();

async function api(params) {
  const r = await fetch(SCRIPT_URL + '?' + new URLSearchParams(params)); return r.json();
}

// ===================== PANTALLAS =====================
function render() {
  const p = S.paso, app = $('#app'), foot = $('#foot');
  $('#bar').style.width = Math.min(100, Math.round(p / pasoFin() * 100)) + '%';
  $('#sub').textContent = S.tipo ? 'CONSTRUCTOR CENTER · ' + TIPOS[S.tipo].t.toUpperCase() + (S.patente ? ' ' + patKey(S.patente) : '') : 'CONSTRUCTOR CENTER';

  $('#bNext').textContent = p === pasoReporte() ? (S.enviando ? 'Enviando…' : '📤 Enviar informe') : 'Siguiente →';
  $('#bNext').disabled = S.enviando;
  if (p === 0) app.innerHTML = vRut();
  else if (p === 1) app.innerHTML = vOperador();
  else if (p === 2) app.innerHTML = vEquipo();
  else if (p < pasoResumen()) app.innerHTML = vBloque(bloques()[p - 3]);
  else if (p === pasoResumen()) app.innerHTML = vResumen();
  else if (p === pasoReporte()) { app.innerHTML = vReporte(); firmaInit(); }
  else app.innerHTML = vFin();
  window.scrollTo(0, 0); guarda(); pintaVoz();
  if (S._ultVoz !== p + '|' + S.tipo) { S._ultVoz = p + '|' + S.tipo; vozPantalla(); }
}
function vRut() {

function seguir() { try { Object.assign(S, JSON.parse(localStorage.getItem(LS))); } catch (e) {} render(); }
function descartar() { try { localStorage.removeItem(LS); } catch (e) {} render(); }
async function buscarRut() {
  const v = $('#rut').value, err = $('#err'); if (rutKey(v).length < 7) { err.textContent = 'Revisa el RUT.'; err.classList.remove('hide'); return; }
  $('#bRut').disabled = true; $('#bRut').textContent = 'Buscando…';
  try {
    const d = await api({ rut: v });
    if (!d.ok) { err.innerHTML = 'No te encontramos en la planilla de Constructor Center. Pide a tu jefatura que te inscriba.'; err.classList.remove('hide'); $('#bRut').disabled = false; $('#bRut').textContent = 'Comenzar'; return; }
    Object.assign(S, { rut: rutFmt(v), persona: d.persona, capac: d.capac || {}, enc: d.encargados || [], equipos: d.equipos || [], respNombre: d.respNombre || '', sucursal: d.persona.sucursal,
      tipo: '', energia: '', patente: '', res: {}, com: {}, fotos: {}, obs: '', firma: '' });
    S.rep = S.enc.filter(g => g.resp || g.sucursal === 'Todas').map(g => g.key);
    S.paso = 1; render();
  } catch (e) { err.textContent = 'Sin conexión con el servidor. Intenta de nuevo.'; err.classList.remove('hide'); $('#bRut').disabled = false; $('#bRut').textContent = 'Comenzar'; }
}
function sugerido(t) {
  const c = (S.persona.cargo || '').toUpperCase(), l = S.persona.lic || [];
  if (t === 'grua') return /GRUA|GRÚA|OPERADOR/.test(c) || l.indexOf('D') >= 0;
  if (t === 'tracto') return /A ?5/.test(c) || l.indexOf('A5') >= 0;
  return /A ?4/.test(c) || l.indexOf('A4') >= 0;
}
function licEstado(t) {

  if (dv != null && dv < 0) return { c: 'b-x', t: '❌ Licencia vencida el ' + S.persona.licVence, nivel: 'Crítica' };
  if (dv != null && dv <= DIAS_AVISO) return { c: 'b-w', t: '⚠️ Licencia vence en ' + dv + ' días', nivel: 'Documento' };
  return { c: 'b-ok', t: '✅ Licencia ' + need.filter(x => l.indexOf(x) >= 0).join('/') + ' vigente' + (S.persona.licVence ? ' hasta ' + S.persona.licVence : ''), nivel: '' };

  const fotos = Object.keys(S.fotos).map(k => { const [b, i] = k.split('.'), bb = bl.find(x => x.id === b), it = bb && bb.items.find(x => x.id === i); return { item: it ? it.t : k, b64: S.fotos[k] }; });
  const body = { rut: S.rut, nombre: S.persona.nombre, cargo: S.persona.cargo, sucursal: S.sucursal, tipo: S.tipo, energia: S.energia ? { gas: 'Gas', electrica: 'Eléctrica', diesel: 'Diésel' }[S.energia] : '',
    patente: S.patente, marca: S.marca, rampla: patKey(S.rampla), km: S.km, prox: S.prox, soap: S.soap, permiso: S.permiso, rt: S.rt, lic: S.persona.lic, licVence: S.persona.licVence,
    resultado: E.resultado, mensaje: E.mensaje, pct: E.pct, aseo: E.aseo, alertas: E.al, okItems: E.okItems, obs: S.obs, reportar: S.rep, firma: S.firma, fotos, ind: (() => { const I = indicadores(); return { rec: I.recTxt || '', litros: S.litros || '', rend: I.rend || '', unidad: I.unidad || '', prom: I.prom || '', faltan: I.faltan == null ? '' : I.faltan, faltanTxt: I.faltanTxt || '', fechaEst: I.fechaEst || '' }; })(),
    bloques: bl.map(b => ({ t: b.t, items: b.items.map(it => ({ t: it.t, crit: it.crit, v: S.res[b.id + '.' + it.id] || '', c: S.com[b.id + '.' + it.id] || '' })) })) };
  S.paso = pasoFin(); S.fin = null; render();
  try {
    const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) }); const d = await r.json();
    if (!d.ok) throw d.error || 'error';
    S.fin = Object.assign(d, { resultado: E.resultado }); S.enviando = false; try { localStorage.removeItem(LS); } catch (e) {}
    $('#app').innerHTML = vFin(); $('#foot').classList.add('hide'); $('#bar').style.width = '100%';
    VOZ.say(E.resultado === 'NO APTO' ? 'Chequeo enviado. Recuerda: no operes este equipo y avisa de inmediato a tu jefatura.' : '¡Chequeo enviado! Gracias por revisar tu equipo. Trabaja seguro.');
  } catch (e) { S.enviando = false; S.paso = pasoReporte(); render(); alertaUI('No se pudo enviar (' + e + '). Revisa tu señal e intenta de nuevo: tu chequeo está guardado.'); }
}
